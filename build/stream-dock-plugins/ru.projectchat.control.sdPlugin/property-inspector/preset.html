<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Шаблон projectCHAT</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #f2f3f5;
        background: #202226;
      }

      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; }
      label { display: block; margin-bottom: 7px; color: #b8bbc2; font-size: 12px; }
      select {
        width: 100%;
        height: 36px;
        border: 1px solid #454850;
        border-radius: 8px;
        padding: 0 10px;
        color: #f2f3f5;
        background: #17191d;
        font: inherit;
        outline: none;
      }
      select:focus { border-color: #d3fb75; box-shadow: 0 0 0 2px rgb(211 251 117 / 16%); }
      select:disabled { opacity: .55; }
      p { margin: 8px 0 0; color: #8e929b; font-size: 11px; line-height: 1.4; }
    </style>
  </head>
  <body>
    <label for="preset">Шаблон</label>
    <select id="preset" disabled>
      <option value="">Подключение к projectCHAT…</option>
    </select>
    <p id="status"></p>

    <script>
      let socket
      let context
      let action
      let settings = {}
      const select = document.querySelector("#preset")
      const status = document.querySelector("#status")

      function send(event, payload) {
        if (!socket || socket.readyState !== WebSocket.OPEN) return
        socket.send(JSON.stringify({ event, context, action, payload }))
      }

      function render(presets) {
        const selectedId = settings.presetId || ""
        select.replaceChildren()
        const placeholder = document.createElement("option")
        placeholder.value = ""
        placeholder.textContent = presets.length ? "Выберите шаблон" : "Нет шаблонов"
        select.append(placeholder)

        for (const preset of presets) {
          const option = document.createElement("option")
          option.value = preset.id
          option.textContent = preset.name
          select.append(option)
        }

        select.value = presets.some((preset) => preset.id === selectedId) ? selectedId : ""
        select.disabled = presets.length === 0
        status.textContent = presets.length ? "" : "Создайте шаблон в projectCHAT."
      }

      select.addEventListener("change", () => {
        const option = select.options[select.selectedIndex]
        settings = {
          presetId: select.value,
          presetName: select.value ? option.textContent : "",
        }
        send("setSettings", settings)
      })

      window.connectElgatoStreamDeckSocket = function (port, uuid, registerEvent, info, actionInfo) {
        context = uuid
        const details = JSON.parse(actionInfo)
        action = details.action
        settings = details.payload && details.payload.settings || {}
        socket = new WebSocket(`ws://127.0.0.1:${port}`)
        socket.addEventListener("open", () => {
          socket.send(JSON.stringify({ event: registerEvent, uuid }))
          send("sendToPlugin", { event: "get-presets" })
        })
        socket.addEventListener("message", (event) => {
          const message = JSON.parse(event.data)
          if (message.event === "sendToPropertyInspector" && message.payload && message.payload.event === "presets") {
            render(Array.isArray(message.payload.presets) ? message.payload.presets : [])
          }
        })
        socket.addEventListener("close", () => {
          select.disabled = true
          status.textContent = "projectCHAT недоступен."
        })
      }
    </script>
  </body>
</html>
